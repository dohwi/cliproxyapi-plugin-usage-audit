name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '26.5.0'
      - name: Generated dashboard is up to date
        run: |
          cd ui
          npm ci
          npm run build
          git diff --exit-code -- ../internal/plugin/dashboard.html
      - name: Verify modules and sanitizer
        run: make verify
      - name: Verify native plugin ABI
        run: make native-smoke
